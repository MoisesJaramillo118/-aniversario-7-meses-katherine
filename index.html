    <div class="container">

        <div class="slideshow">

            </div>
            <!-- Slides will be generated via JS -->
            <button id="prevBtn" class="nav-button prev">&#9664;</button>
            <button id="nextBtn" class="nav-button next">&#9654;</button>
        </div>

        <div class="messages">
            <!-- Romantic messages will appear below slideshow -->
        </div>
    </div>

    <script>
        // Data for slides and messages
        const slides = [
            {

                text: 'eres mi persona favorita en este mundo, mi confidente, mi cómplice y mi mejor amigo.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.14 (2).jpeg',
                title: 'Gracias por ser especial',
                text: 'gracias por ser especial en mi vida, por tu luz y tu energía que iluminas cada día.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.14.jpeg',
                title: 'Te amo demasiado',
                text: 'te amo demasiado y te quiero por toda la eternidad, cada día más que el anterior.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.15 (1).jpeg',
                title: 'Hace 7 meses',
                text: 'Hace 7 meses conocí al amor de mi vida, y cada día contigo es un regalo que atesoro.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.15 (2).jpeg',
                title: 'Eres hermosa',
                text: 'eres la mujer más hermosa del universo, tanto por dentro como por fuera, y eso me hace el hombre más afortunado.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.15 (3).jpeg',
                title: 'Siempre estaré',
                text: 'siempre estaré para ti, en los buenos momentos y en los desafíos.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.15.jpeg',
                title: 'De la mano',
                text: 'De la mano juntos por toda la eternidad, enfrentando todo lo que venga.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.16 (1).jpeg',
                title: 'Cada día',
                text: 'cada día nos conocemos más y nuestro amor crece y se fortalece.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.16 (2).jpeg',
                title: 'Aunque tengamos diferencias',
                text: 'aunque tengamos diferencias, aprendemos a crecer juntas y ser mejores cada día.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.16 (3).jpeg',
                title: 'Ser felices',
                text: 'ser felices amándonos el uno al otro es nuestro propósito y nuestra alegría.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.16 (4).jpeg',
                title: 'Nuestro amor',
                text: 'nuestro amor es único, especial y lleno de momentos mágicos que atesoramos.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.16 (5).jpeg',
                title: 'Mi niña hermosa',
                text: 'eres mi niña hermosa, mi luz en los días oscuros y mi razón para sonreír.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.16.jpeg',
                title: 'Eres mi vida',
                text: 'eres el amor de mi vida y mi razón de ser, mi inspiración constante.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.17 (1).jpeg',
                title: 'Contigo siempre',
                text: 'contigo quiero estar por siempre y jamás, construyendo nuestro futuro juntos.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.17 (2).jpeg',
                title: 'Mi eternidad',
                text: 'eres mi eternidad, mi siempre, mi para siempre, mi hogar y mi refugio.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.17 (3).jpeg',
                title: 'Te adoro',
                text: 'te adoro más de lo que las palabras pueden expresar, más allá de lo que cualquier lenguaje puede decir.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.17 (4).jpeg',
                title: '7 meses de nosotros',
                text: '7 meses de amor, risas, aprendizajes y crecimiento juntos como pareja.'
            },
            {
                src: '/images/WhatsApp Image 2026-09-11 at 22.56.17.jpeg',
                title: 'Mi princessa',
                text: 'eres mi princesa, mi reina, mi todo, y mereces todo el amor y felicidad del mundo.'
            }
        ];

        const messages = [
            { icon: '💖', title: 'Mi amorcito', text: 'eres mi persona favorita en este mundo, mi confidente, mi cómplice y mi mejor amigo. Contigo descubrí lo que significa amar profundamente y ser amado a cambio.' },
            { icon: '👧', title: 'Mi niña hermosa', text: 'cada día descubro lo afortunado que soy de tener a alguien tan especial, tan bella por dentro y por fuera. Tu sonrisa ilumina mis días oscuros.' },
            { icon: '♾️', title: 'Mi eternidad', text: 'contigo quiero construir un futuro lleno de amor, aventuras y momentos que atesoraremos para siempre. Eres mi hogar, mi refugio y mi razón de ser.' },
            { icon: '😄', title: 'Nuestra alegría', text: 'juntos encontramos la felicidad en las cosas simples: una conversación, una sonrisa, un abrazo. Nuestra risa es la mejor música que existe.' },
            { icon: '🌟', title: 'Nuestro crecimiento', text: 'aunque tengamos diferencias, aprendemos a crecer juntas y ser mejores cada día. Nuestra relación nos enseña paciencia, comprensión y amor incondicional.' },
            { icon: '🎯', title: 'Nuestro propósito', text: 'ser felices amándonos el uno al otro es nuestro propósito y nuestra alegría. Juntos somos más fuertes, más valientes y más completos.' }
        ];

        const slideshow = document.querySelector('.slideshow');
        const messagesContainer = document.querySelector('.messages');
        const audio = document.getElementById('background-audio');
        const loadingSpinner = document.getElementById('loading-spinner');

        // Create slides with Ken Burns effect containers
        slides.forEach((slide, index) => {
            const slideDiv = document.createElement('div');
            slideDiv.className = `slide${index === 0 ? ' active' : ''}`;
            slideDiv.style.backgroundImage = `url('${slide.src}')`;
            slideDiv.innerHTML = `
                <div class="slide-content">
                    <div class="slide-overlay">
                        <h2 class="slide-title">${slide.title}</h2>
                        <p class="slide-text">${slide.text}</p>
                    </div>
                </div>
            `;
            slideshow.appendChild(slideDiv);
        });

        // Create messages
        const messagesDiv = document.createElement('div');
        messagesDiv.className = 'messages-grid';
        messages.forEach(msg => {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message-card';
            msgDiv.innerHTML = `
                <div class="message-icon">${msg.icon}</div>
                <h3 class="message-title">${msg.title}</h3>
                <p class="message-text">${msg.text}</p>
            `;
            messagesDiv.appendChild(msgDiv);
        });
        messagesContainer.appendChild(messagesDiv);

        // Slideshow animation with Ken Burns effect
        let current = 0;
        const total = slides.length;
        let kenBurnsIntervals = []; // To store intervals for each slide's Ken Burns effect

        function startKenBurnsEffect(slideElement) {
            // Clear any existing intervals for this slide
            const slideIndex = Array.from(slideshow.children).indexOf(slideElement);
            if (kenBurnsIntervals[slideIndex]) {
                clearInterval(kenBurnsIntervals[slideIndex]);
            }

            // Randomly choose zoom direction and pan direction
            const zoomIn = Math.random() > 0.5;
            const panX = Math.random() > 0.5 ? 'left' : 'right';
            const panY = Math.random() > 0.5 ? 'top' : 'bottom';

            // Set initial state
            let scale = zoomIn ? 1 : 1.1;
            let positionX = panX === 'left' ? 0 : panX === 'right' ? 100 : 50;
            let positionY = panY === 'top' ? 0 : panY === 'bottom' ? 100 : 50;

            // Apply initial styles
            slideElement.style.backgroundSize = `${zoomIn ? '100%' : '110%'}`;
            slideElement.style.backgroundPosition = `${positionX}% ${positionY}%`;

            // Create animation interval
            const interval = setInterval(() => {
                // Update scale and position slowly
                const targetScale = zoomIn ? 1.1 : 1;
                const targetX = panX === 'left' ? 100 : panX === 'right' ? 0 : 50;
                const targetY = panY === 'top' ? 100 : panY === 'bottom' ? 0 : 50;

                // Easing function for smooth transition
                const ease = (t) => t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;

                // In a real implementation, we'd use CSS transitions or requestAnimationFrame
                // For simplicity, we'll just update the styles directly
                // In practice, this would be better handled with CSS animations
            }, 50); // Update every 50ms for smoothness

            // Store the interval
            kenBurnsIntervals[slideIndex] = interval;
        }

        function stopKenBurnsEffect(slideElement) {
            const slideIndex = Array.from(slideshow.children).indexOf(slideElement);
            if (kenBurnsIntervals[slideIndex]) {
                clearInterval(kenBurnsIntervals[slideIndex]);
                kenBurnsIntervals[slideIndex] = null;
            }
        }

        function showNextSlide() {
            // Stop Ken Burns on current slide
            const currentSlide = slideshow.children[current];
            stopKenBurnsEffect(currentSlide);
            currentSlide.classList.remove('active');

            // Move to next slide
            current = (current + 1) % total;
            const nextSlide = slideshow.children[current];
            nextSlide.classList.add('active');

            // Start Ken Burns on new slide
            startKenBurnsEffect(nextSlide);
        }

        function showPrevSlide() {
            // Stop Ken Burns on current slide
            const currentSlide = slideshow.children[current];
            stopKenBurnsEffect(currentSlide);
            currentSlide.classList.remove('active');

            // Move to previous slide
            current = (current - 1 + total) % total;
            const prevSlide = slideshow.children[current];
            prevSlide.classList.add('active');

            // Start Ken Burns on new slide
            startKenBurnsEffect(prevSlide);
        }

        // Change slide every 6 seconds
        let slideInterval = setInterval(showNextSlide, 6000);

        // Reset interval on user interaction (manual navigation)
        function resetInterval() {
            clearInterval(slideInterval);
            slideInterval = setInterval(showNextSlide, 6000);
        }

        // Preload images and then play audio
        let loaded = 0;
        const totalImages = slides.length;

        function imageLoaded() {
            loaded++;
            if (loaded >= totalImages) {
                // All images loaded, hide spinner and play audio
                loadingSpinner.style.opacity = '0';
                setTimeout(() => {
                    loadingSpinner.style.display = 'none';
                }, 300);

                // Play audio
                audio.play().catch(e => {
                    console.log('Autoplay prevented:', e);
                    // Audio will be enabled by user interaction if needed
                });
            }
        }

        slides.forEach(slide => {
            const img = new Image();
            img.src = slide.src;
            img.onload = imageLoaded;
            img.onerror = imageLoaded; // count as loaded even if error to avoid hanging
        });

        // Touch support for manual swipe
        let touchStartX = 0;
        let touchEndX = 0;

        slideshow.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        slideshow.addEventListener('touchend', e => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const swipeThreshold = 50; // minimum distance to trigger
            const diff = touchStartX - touchEndX;
            if (diff > swipeThreshold) {
                // swipe left -> next slide
                showNextSlide();
                resetInterval();
            } else if (diff < -swipeThreshold) {
                // swipe right -> previous slide
                showPrevSlide();
                resetInterval();
            }
        }

        // Navigation buttons
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        prevBtn.addEventListener('click', () => {
            showPrevSlide();
            resetInterval();
        });
        nextBtn.addEventListener('click', () => {
            showNextSlide();
            resetInterval();
        });

        // Optional: keyboard arrows
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') {
                showNextSlide();
                resetInterval();
            } else if (e.key === 'ArrowLeft') {
                showPrevSlide();
                resetInterval();
            }
        });

        // Initialize Ken Burns effect on first slide
        if (slideshow.children.length > 0) {
            startKenBurnsEffect(slideshow.children[0]);
        }
    </script>
</body>
</html>
